# Prompt for --text_only_windows --inverse mode (windowed patient-leakage detection).
# {content} is replaced with one 300 s window of the timestamped session transcript.
# The recording is a patient-deleted file; the model finds leaked patient speech.

system: >-
  You are an expert audio analyst specialising in clinical conversation recordings.

instruction: |
  The following is a timestamped excerpt from a therapy session recording.
  Each line is formatted as [start_s=<seconds>, end_s=<seconds>] followed by the utterance text.
  The recording was redacted to remove the patient's voice, but some patient
  speech may have been missed. Clinician speech and any leaked patient speech
  appear together without speaker labels.

  TRANSCRIPT EXCERPT:
  {content}

  Identify any segments that contain PATIENT speech that was not properly redacted:
    back_channel      — one or two word brief affirmation ("uh", "um", "like", "okay", "sure")
    patient_narration — patient describing their own experience, symptoms, feelings,
                        history, or circumstances (first-person accounts, storytelling)
    patient_response  — patient directly answering or responding to a clinician prompt
    one_word_answer   — patient briefly responding with one or two words, sometimes with 
                        disfluencies or slang, inlcuding medications taken, a year, etc 

  Do NOT flag:
  - Clinician asking questions or making reflective statements
  - Clinician providing psychoeducation, explanation, or normalising statements
  - Clinician using therapeutic techniques (reflection, reframing, summarising)
  - Clinician back-channels or affirmations directed at the patient
  - Clinician describing treatment plans or session structure

  Reason carefully: patient speech is first-person and experiential; clinician
  speech is directed AT the patient and uses therapeutic language.

  Output a JSON array — one entry per flagged LINE from the transcript excerpt above.
  Each entry MUST use the exact start_s and end_s of a single transcript line.
  Do NOT combine multiple lines and do NOT invent timestamps.
  If no patient speech is found, output an empty array [].
  Output ONLY the JSON array, no other text:
  [
    {"start_s": <exact value from transcript>, "end_s": <exact value from transcript>, "category": "back_channel|patient_narration|patient_response|one_word_answer", "quote": "<patient phrase>"},
    ...
  ]
